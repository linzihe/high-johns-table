sc": "药蜀葵（Althea）：药蜀葵是一种色彩鲜艳、四英尺高的草本植物，原产于欧洲，也可在美国种植。药蜀葵蕴含着灵性能量，有助于吸引抚慰心灵的爱情、提供抵御肉体与灵性", "link": "pages/herbs.html"}, {"cat": "草药", "name": "明矾 · Alum", "desc": "明矾（Alum）：明矾是水合硫酸铝，在世界各地均可找到。明矾的天然灵性能量与净化相关联，使这种无处不在的石头能够驱散家中的邪能并提升通灵能力。明矾也可用于魔咒袋", "link": "pages/herbs.html"}, {"cat": "草药", "name": "氨水 · Ammonia", "desc": "氨水（Ammonia）：液态氨是一种挥发性化合物，接触皮肤即会冻伤。这种化合物在世界任何地方都能找到，含有有助于吸引真挚爱情和吸引力的天然灵性能量。氨水还可用于", "link": "pages/herbs.html"}, {"cat": "草药", "name": "当归 · Angelica", "desc": "当归（Angelica）：当归草药原产于叙利亚，现生长于欧洲的温带地区。当归含有天然的灵性能量，可增强对肉体与灵性伤害的保护，并有助于驱散负能量。当归可加入魔咒", "link": "pages/herbs.html"}, {"cat": "草药", "name": "八角茴香 · Anise", "desc": "洋茴香（Anise）：洋茴香是一种三英尺高的一年生植物，原产于埃及和东地中海地区。洋茴香以其耀眼的白花和特有的芳香气息而著称。洋茴香的灵性能量可用于招来好运。在", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蚂蚁 · Ants", "desc": "蚂蚁（Ants）：在胡毒中，蚂蚁被认为是灵性向导，因此可用于驱避邪能的仪式。蚂蚁以其群居生活而闻名，因此也是确保牢固友谊、和平与和谐仪式中的重要成分。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "苹果 · Apple", "desc": "苹果（Apple）：苹果树广泛分布于欧洲和美国。苹果树的花以其令人难以置信的香气和粉白相间的脉络而闻名。苹果花是吸引爱情和实现愿望与渴望的仪式中的强力成分。苹果", "link": "pages/herbs.html"}, {"cat": "草药", "name": "竹芋 · Arrowroot", "desc": "竹芋（Arrowroot）：竹芋是一种耐寒的热带块茎植物，主要生长于印度尼西亚。竹芋以其保护家居免受邪能侵扰的能力而著称。该块茎也可切碎用于护符中，以招来好运、", "link": "pages/herbs.html"}, {"cat": "草药", "name": "阿魏脂 · Asafetida", "desc": "阿魏：阿魏是从阿魏属植物中采集的干燥乳胶。阿魏原产于北非平原、阿富汗和伊朗，这种研磨后的材料具有灵性力量，有助于吸引爱情和实现愿望。阿魏因其刺鼻的气味，也有效用", "link": "pages/herbs.html"}, {"cat": "草药", "name": "白蜡树 · Ash Tree", "desc": "白蜡树：白蜡树是一种高大威严的树木，树皮浅灰色，花期在四月至六月之间。白蜡树遍布美国和加拿大，有助于吸引好运、促进健康、提升创造力与知识，并促进和平与和谐。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蜜獾齿 · Badger Tooth", "desc": "蜜獾牙：蜜獾的牙齿在胡毒术中是强有力的好运护符。因此，这种材料通常被放入为赌徒和商人制作的护身符袋（gris-gris bags 或 mojo bags）中，以", "link": "pages/herbs.html"}, {"cat": "草药", "name": "基列乳香苞 · Balm of Gilead Buds", "desc": "基列乳香花蕾：这种具有圣经意义的草药遍布美国、欧洲和亚洲部分地区。基列乳香在夏末至秋初长叶，其花蕾蕴含灵性能量，有助于驱逐负面灵体、促进良好睡眠，并确保在家中及", "link": "pages/herbs.html"}, {"cat": "草药", "name": "小檗 · Barberry", "desc": "小檗：小檗属植物的浆果在胡毒术中是极为强大的魔力来源。小檗植株可生长至五米高，分布于亚洲、非洲、欧洲以及南北美洲。其鲜红色浆果可以晒干后用于仪式中，以吸引爱情、", "link": "pages/herbs.html"}, {"cat": "草药", "name": "罗勒 · Basil", "desc": "罗勒：罗勒分布于全球所有热带地区，从美洲到欧洲、非洲和亚太地区。它属于薄荷科。罗勒叶片具有非常强烈的薄荷气味，叶子可以晒干并放置在家中，以保护家庭免受邪恶能量侵", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蝙蝠与夜鹰 · Bats and Bullbats", "desc": "蝙蝠与美洲夜鹰：在胡毒术中，蝙蝠被用来驱逐环境中的负面灵体。蝙蝠也可以在仪式中用于增强灵视力。蝙蝠的血液有时会被加入护身符袋（mojo bags）中，以增强超自", "link": "pages/herbs.html"}, {"cat": "草药", "name": "月桂 · Bay", "desc": "月桂：月桂植物生长于温和气候中，常见于北美和欧洲的田野。月桂叶具有强烈的独特气味，捆成一束时有助于保护家庭免受邪恶能量侵扰、招来好运，并确保家中和平与和谐。月桂", "link": "pages/herbs.html"}, {"cat": "草药", "name": "杨梅 · Bayberry", "desc": "杨梅：这种茂密的落叶植物原产于美国东部，在宾夕法尼亚州的田野中大量生长。杨梅叶非常适合治疗喉咙痛，并可制成药膏来治疗伤口和溃疡。叶子也可以用于仪式中，以吸引好运", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑豆 · Black Beans", "desc": "黑豆：黑豆常见于美国南部和拉丁美洲其他地区。黑豆可以在仪式中用于驱逐负面灵体和邪恶灵性力量。黑豆也可以撒在祭坛上，以增强施术者的灵力。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "豇豆 · Black-eyed Peas", "desc": "黑眼豆：黑眼豆在美国、欧洲、亚洲和非洲各地都有种植。这些丰富的豆类以其正面的精神能量而闻名，并能有效帮助吸引运气和好运。黑眼豆也有助于确保健康、增强勇气和智慧。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "熊果 · Bearberry", "desc": "熊果：熊果是一种低矮植物，在美国和欧洲的森林和林地中生长，最高约12英寸。熊果的特征是结有鲜红色的果实，并在五月至六月间开出白色蜡质花朵。熊果花的叶子含有天然的", "link": "pages/herbs.html"}, {"cat": "草药", "name": "安息香 · Benzoin", "desc": "安息香：安息香是苏合香属树木树皮被割开后获得的硬化汁液或树脂。作为苏合香树的产物，安息香带有树木的灵性能量，因此它成为实现正义、驱除恐惧和增强天生通灵能力的仪式", "link": "pages/herbs.html"}, {"cat": "草药", "name": "香柠檬 · Bergamot Orange", "desc": "佛手柑：佛手柑植物是一种耐寒的多年生植物，常见于北美的林地、田野和茂密森林中。佛手柑橙含有灵性能量，使其在实现头脑清晰与平衡、恢复青春活力以及清除负面能量的仪式", "link": "pages/herbs.html"}, {"cat": "草药", "name": "南蛇藤 · Bittersweet", "desc": "白英：白英是一种蔓生的木质藤本植物，原产于美国中部和东部。白英含有天然的灵性能量，有助于让家中充满和平、吸引真挚的朋友，并提供免受负面灵性力量侵害的保护。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "苦草 · Bitter Weed", "desc": "苦草：苦草是菊科开花植物，主要分布于美国西南部和中美洲。苦草常见于加利福尼亚州、得克萨斯州、堪萨斯州和科罗拉多州的田野中。这种植物最高可长到2英尺，历史上用于治", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑莓 · Blackberry", "desc": "黑莓：黑莓植物在美国和欧洲各地生长旺盛，果实和叶子在四月至七月间开得最好。黑莓叶可制成浸剂治疗痔疮和腹泻，也可用于治疗痤疮。在魔法用途上，黑莓叶可用于招来喜悦、", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑猫骨 · Black Cat Bone", "desc": "黑猫骨：黑猫骨主要是一种幸运护符，经常被赌徒放入随身携带的护身符袋（mojo 和 gris-gris bags）中。人们相信黑猫骨含有灵性能量，有助于吸引好运、", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑猫毛 · Black Cat Hair", "desc": "黑猫毛：从黑猫皮毛上拔下的十根猫毛可以制成强效护符，用来吸引情人、留住配偶或恋人，或平息恋人之间的争执与冲突。我们也可以用黑猫毛来辅助自然本能、增强一个人的天生", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑乳牛乳 · Black Cow’s Milk", "desc": "黑牛奶：从黑牛身上采集的新鲜牛奶经常被用来安抚灵体，并将邪恶力量从居所或个人生活中驱除。黑牛奶还可以用来确保免受不可预见问题的侵扰，并促进病患的疗愈与康复。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑狗毛 · Black Dog Hair", "desc": "黑狗毛：黑狗毛是制造冲突的特殊材料。因此，这种材料经常用于仪式中，以引起伴侣或配偶之间的争吵和敌意。黑狗毛也可以用来诅咒某人或对其施以邪术。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑母鸡蛋 · Black Hen’s Egg", "desc": "黑母鸡蛋：黑母鸡的蛋用于清洁和净化身体，驱除负面精神能量。黑母鸡蛋也可以放在家中，以驱散有害振动、促进生育，并带来健康与完整。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑母鸡羽 · Black Hen Feathers", "desc": "黑母鸡羽毛：黑母鸡的羽毛用于加深灵性觉知、提供身体上的保护，并帮助人们克服悲伤和痛苦。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑胡椒 · Black Pepper", "desc": "黑胡椒：黑胡椒通常生长在印度南部和中国，可长至十二英尺高，是多年生植物。黑胡椒用于缓解便秘和治疗尿路感染。在魔法上，黑胡椒用于对敌人施放诅咒和恶咒、驱散负面精神", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑根 · Black Root", "desc": "黑根草：黑根草在美国和加拿大大量生长，药用上用于治疗便秘、肝脏疾病和胆囊感染。这种七英尺高的草药也可用于魔法，招来好运和丰盛，并保护家庭免受负面精神能量侵害。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "黑蛇根 · Black Snakeroot", "desc": "黑蛇根（Cimicifuga racemosa）：又称黑升麻，生长在北美（特别是加拿大和美国）粗壮的黑色根茎中。该植物在六月和七月初生长旺盛。黑升麻是抵御毒药和", "link": "pages/herbs.html"}, {"cat": "草药", "name": "圣蓟 · Blessed Thistle", "desc": "圣蓟（Cnicus benedictus）：圣蓟是一种两英尺高的灌木，主要见于南欧和亚洲，也出现在地中海附近的特定地区。圣蓟在五月至七月间开花最佳，其叶子用于净", "link": "pages/herbs.html"}, {"cat": "草药", "name": "血根草 · Blood Root", "desc": "血根草：血根草是一种多年生草本植物，主要生长在东亚。在民间医学中，血根草用于治疗发烧、腹泻和牙痛。在胡毒民间实践中，血根草有助于招来全面保护、吸引真挚的爱与幸福", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蓝莓 · Blueberry", "desc": "蓝莓：蓝莓在美国和北美其他地区大量生长。蓝莓叶可制成浸剂，帮助降低血液胆固醇水平、控制肥胖和对抗尿路感染。蓝莓也用于胡毒魔法实践，以吸引财富和好运、预防疾病和病", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蓝升麻 · Blue Cohosh", "desc": "蓝升麻：蓝升麻是一种多年生林地草本植物，生长在美国西南部和东部。蓝升麻用于帮助缓解痛经和减轻分娩疼痛，但孕妇必须避免使用。在民间魔法实践中，蓝升麻用于吸引金钱、", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蓝鸢尾 · Blue Flag", "desc": "蓝鸢尾：蓝鸢尾是一种多年生草本植物，主要生长在北美。用蓝鸢尾草制成的浸剂可用于治疗伤口、感冒、耳痛甚至霍乱。在民间魔法实践中，蓝鸢尾草的精神能量被用来实现愿望和", "link": "pages/herbs.html"}, {"cat": "草药", "name": "硫酸铜 · Bluestone", "desc": "蓝石：蓝石主要用于帮助稳定和专注。硫酸铜在世界各地均有供应，从非洲、亚洲到欧洲、澳大利亚和美洲。在胡毒仪式中，可将硫酸铜放在祭坛上，以增强通灵清晰度，并在占卜实", "link": "pages/herbs.html"}, {"cat": "草药", "name": "波尔多叶 · Boldo", "desc": "波尔多树：波尔多树是一种独特罕见的草药，开有明亮的白色和黄色花朵，主要生长在智利中部的田野中。波尔多树用于缓解胃肠道痉挛和治疗腹泻。用波尔多树叶制成的浸剂也用于", "link": "pages/herbs.html"}, {"cat": "草药", "name": "贯叶兰 · Boneset", "desc": "接骨草：这种北美草药成熟时长至三英尺高，在民间医学中用于治疗发烧和加速骨折愈合。在魔法精神实践中，接骨草用于促进身体和精神伤害的快速愈合。该草药还含有强大的精神", "link": "pages/herbs.html"}, {"cat": "草药", "name": "琉璃苣 · Borage", "desc": "琉璃苣：琉璃苣是一种耐寒的一年生植物，原产于中东，但现在普遍生长在美国。琉璃苣的叶子在三月至六月间开得最好，可采集制成浸剂，对减轻眼部刺激很有效。在民间魔法实践", "link": "pages/herbs.html"}, {"cat": "草药", "name": "硼酸 · Boric Acid", "desc": "硼酸：硼酸作为强效消毒剂而广受欢迎，并在民间魔法实践中常被用于治疗阴道感染。在民间魔法实践中，硼酸用于消除环境中的负面振动和精神能量、吸引爱与激情，并保护个人免", "link": "pages/herbs.html"}, {"cat": "草药", "name": "扫帚 · Broom", "desc": "扫帚：扫帚在胡毒中是纷争的工具。扫帚可用于咒语中，保护家庭免受负面精神能量侵害，并防止未来有害的精神振动进入家中。扫帚也被用来对他人施放诅咒和恶咒，导致不幸、疾", "link": "pages/herbs.html"}, {"cat": "草药", "name": "布楚叶 · Buchu", "desc": "布枯：布枯是一种开花草本植物，主要生长在南非。布枯叶在五月下旬至七月初采集，可用于治疗尿路感染和膀胱疾病。在民间魔法实践中，布枯可用于帮助关系恢复平衡、提供免受", "link": "pages/herbs.html"}, {"cat": "草药", "name": "七叶树果 · Buckeye", "desc": "七叶树：七叶树是一种耐寒的多年生草本植物，原产于北美林地。七叶树在俄亥俄州和密西西比州大量生长，某些地方可达五十英尺高。七叶树坚果的油可收集起来，涂抹在疼痛的关", "link": "pages/herbs.html"}, {"cat": "草药", "name": "牛蒡 · Burdock", "desc": "牛蒡：牛蒡是一种两年生草本植物，主要生长在欧洲和北美。用牛蒡叶制成的浸剂可用于治疗关节炎，并促进伤口和溃疡的愈合。在民间魔法实践中，牛蒡叶用于净化灵魂和家庭，并", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蝴蝶草 · Butterfly Weed", "desc": "蝴蝶草（Butterfly Weed）：蝴蝶草是一种色彩缤纷的植物，开明亮的黄色花朵，花蜜能吸引蝴蝶。该植物生长在美国东部和西北部，可长到两英尺高。由这种草药叶", "link": "pages/herbs.html"}, {"cat": "草药", "name": "纽扣蛇根 · Button Snake Root", "desc": "蛇根草（Button Snake Root）：蛇根草是一种多年生北美草本植物。其叶子可制成浸剂，用于改善肾脏和性器官的功能。蛇根草也可用作蛇毒的自然解毒剂。在民", "link": "pages/herbs.html"}, {"cat": "草药", "name": "仙人掌 · Cactus", "desc": "仙人掌（Cactus）：仙人掌在民间精神实践中用于对敌人施咒和下咒、保护家庭免受负面能量的侵害、带来好运和丰盛，以及疗愈心灵、身体和精神。仙人掌原产于北非和中东", "link": "pages/herbs.html"}, {"cat": "草药", "name": "菖蒲 · Calamus", "desc": "菖蒲（Calamus）：菖蒲根被用于民间魔法实践，以吸引好运和丰盛，促进身心的疗愈，并保护个人和家庭免受负面精神力量侵害。菖蒲根生长于欧洲、日本、北亚和美国各地", "link": "pages/herbs.html"}, {"cat": "草药", "name": "金盏花 · Calendula", "desc": "金盏花（Calendula）：万寿菊又称金盏花，被用于胡毒魔法中帮助实现愿望和梦想，为个人提供精神保护，并驱散负面和有害的精神能量。金盏花整个夏天开花，遍布美国", "link": "pages/herbs.html"}, {"cat": "草药", "name": "樟脑 · Camphor", "desc": "樟脑（Camphor）：樟脑是一种从樟树木材中提取的有机化合物，胡毒术士用它来吸引好运和丰盛，并招来和平与宁静。樟脑也可用于驱散负面精神能量，增强占卜和通灵清晰", "link": "pages/herbs.html"}, {"cat": "草药", "name": "葛缕子 · Caraway", "desc": "葛缕子（Caraway）：葛缕子籽被民间魔法从业者用于防止儿童生病、确保夫妻之间的忠诚，以及驱散个人生活和居所中的负面能量。葛缕子是二年生草本植物，可长到两英尺", "link": "pages/herbs.html"}, {"cat": "草药", "name": "小豆蔻 · Cardamom", "desc": "小豆蔻（Cardamom）：小豆蔻种子被胡毒术士用于提高男性性欲、增强关系中的激情，并吸引来自伴侣的真爱和深情。小豆蔻是大型多年生草本植物，有粗壮的肉质根，原产", "link": "pages/herbs.html"}, {"cat": "草药", "name": "药鼠李皮 · Cascara Sagrada", "desc": "药鼠李（Cascara Sagrada）：药鼠李树的树皮被胡毒术士用来帮助个人在法庭上获得好感、解决争端，并从危险境地中全身而退。树皮也用于招来保护并吸引丰盛进", "link": "pages/herbs.html"}, {"cat": "草药", "name": "猫薄荷 · Catnip", "desc": "猫薄荷（Catnip）：猫薄荷被胡毒术士用于邀请爱与幸福进入个人生活，增强一个人的青春活力和美貌，并驱散负面精神能量和振动。猫薄荷有气味浓烈的叶子，可长到两英尺", "link": "pages/herbs.html"}, {"cat": "草药", "name": "猫眼螺壳 · Cat’s Eye Shell", "desc": "猫眼贝壳（Cat’s Eye Shell）：猫眼贝壳是海螺Turbo smaragdus螺壳厣的本地名称。“猫眼贝壳”一词的采用是因为其外观与猫眼相似。猫眼贝壳", "link": "pages/herbs.html"}, {"cat": "草药", "name": "雪松 · Cedar", "desc": "雪松（Cedar）：雪松被胡毒术士用于驱散个人生活或家庭/空间中的负面精神能量。雪松也用于增强通灵能力并减少噩梦的发生。这种草药也是吸引爱情和加深关系激情的重要", "link": "pages/herbs.html"}, {"cat": "草药", "name": "白屈菜 · Celandine", "desc": "白屈菜（Celandine）：白屈菜被用于草药魔法中，帮助受害者脱离虐待关系，驱散导致抑郁的负面精神能量，并确保法律案件的成功。白屈菜是一种侵略性杂草，生长在欧", "link": "pages/herbs.html"}, {"cat": "草药", "name": "芹菜 · Celery", "desc": "芹菜（Celery）：芹菜被胡毒术士用于帮助改善睡眠质量和治愈失眠。这种耐寒植物也用于咒语中，以增强专注力、集中力和通灵能力，确保与精神领域的无缝连接。芹菜原产", "link": "pages/herbs.html"}, {"cat": "草药", "name": "洋甘菊 · Chamomile", "desc": "洋甘菊（Chamomile）：洋甘菊在许多民间魔法实践中作为有助于缓解压力的草药而广受欢迎。在胡毒中，洋甘菊浴有助于清除负面精神能量、吸引爱情和深情，并招来丰盛", "link": "pages/herbs.html"}, {"cat": "草药", "name": "樱桃 · Cherry", "desc": "樱桃（Cherry）：樱桃树被用于胡毒魔法中，以吸引爱情、提高精神意识，并增强男性和女性的生育能力。气味甜美的樱桃树遍布美国和欧洲，并用于民间医学中以减轻炎症疼", "link": "pages/herbs.html"}, {"cat": "草药", "name": "奇亚籽 · Chia Seed", "desc": "奇亚籽（Chia Seed）：奇亚植物的种子被用于胡毒中，保护个人和家庭免受负面精神能量侵害，并净化家中的负面精神能量。种子也可用于仪式中吸引财富和丰盛。奇亚植", "link": "pages/herbs.html"}, {"cat": "草药", "name": "繁缕 · Chickweed", "desc": "繁缕（Chickweed）：繁缕被用于民间魔法实践中，以吸引爱情和深情、提高生育能力，并增强通灵清晰度，从而获得更清晰的占卜和与精神领域的连接。繁缕是耐寒的一年", "link": "pages/herbs.html"}, {"cat": "草药", "name": "菊苣 · Chicory", "desc": "菊苣（Chicory）：菊苣的叶子被用于胡毒魔法实践中，以消除个人沐浴中的障碍、打开紧闭的门，并确保即使是最困难的愿望也能实现。菊苣是多年生草本植物，有粗壮的主", "link": "pages/herbs.html"}, {"cat": "草药", "name": "肉桂 · Cinnamon", "desc": "肉桂（Cinnamon）：肉桂被用于胡毒草药魔法中，以吸引成功和财富、带来改变和转变，并保护个人免受负面精神力量侵害。肉桂原产于锡兰和印度，但在牙买加、墨西哥和", "link": "pages/herbs.html"}, {"cat": "草药", "name": "香茅 · Citronella", "desc": "香茅：香茅是从香茅属植物中提取的精油。香茅油在胡杜民间魔法实践中用于招引丰盛与繁荣、加速身体与灵性疗愈，以及驱除忧虑与不安。香茅属植物是一种原产于南亚的耐寒多年", "link": "pages/herbs.html"}, {"cat": "草药", "name": "四叶草 · Four-leaf Clover", "desc": "四叶草（白三叶草）：四叶草是较为常见的三叶草植物中极为罕见的变种。四叶草的稀有性和独特性极为显著，其叶片在传统民间巫术中被用来招引好运、财富、成功和金钱。四叶草", "link": "pages/herbs.html"}, {"cat": "草药", "name": "红车轴草 · Red Clover", "desc": "红三叶草：红三叶草草药原产于欧洲、北非和西亚的田野。红三叶草植物在胡毒草药魔法中用于增强自然的通灵能力、招来健康与福祉，并吸引真挚的爱与激情。在民俗医学中，红三", "link": "pages/herbs.html"}, {"cat": "草药", "name": "白车轴草 · White Clover", "desc": "白三叶草：白三叶草是四叶草中较为常见的形式，其特征是独特的白色花朵。白三叶草原产于欧洲和不列颠群岛，也生长于北美和南亚。白三叶草草药在传统胡毒巫术中用于吸引财富", "link": "pages/herbs.html"}, {"cat": "草药", "name": "丁香 · Cloves", "desc": "丁香：丁香在胡杜草药民间魔法中用于吸引丰盛、爱情和激情，并驱散负面能量和恶意的流言蜚语。丁香树原产于摩鹿加群岛，但现在在美国、欧洲和加拿大各地都有种植。丁香在草", "link": "pages/herbs.html"}, {"cat": "草药", "name": "可可 · Cocoa", "desc": "可可：可可树的种子和叶子在胡杜魔法实践中用于招引好运，为个人生活和家庭带来平和与宁静。可可树原产于西非、欧洲和北美的热带森林。这种多年生树木结出大荚果，其中的种", "link": "pages/herbs.html"}, {"cat": "草药", "name": "咖啡 · Coffee", "desc": "咖啡：咖啡是一种广受欢迎的 commodity crop（经济作物），其种子用于制作世界上最受欢迎的刺激性饮料之一。在胡杜中，咖啡树的叶子和种子用于吸引丰盛和财", "link": "pages/herbs.html"}, {"cat": "草药", "name": "棺钉 · Coffin Nails", "desc": "棺材钉：建造棺材时使用的钉子可以被取下并用于多种用途。棺材钉象征着死亡和黑暗，用于施展分离情侣或引发冲突、争吵的法术。棺材钉也可以用来对敌人施咒或下蛊。一些胡杜", "link": "pages/herbs.html"}, {"cat": "草药", "name": "款冬 · Coltsfoot", "desc": "款冬：款冬在传统胡杜魔法中用于吸引平和与宁静，并提升用于占卜目的的通灵视觉质量。款冬生长在欧洲、北美和东南亚的大部分地区，开有形状像马蹄的亮黄色花朵。在传统民间", "link": "pages/herbs.html"}, {"cat": "草药", "name": "聚合草 · Comfrey", "desc": "聚合草：聚合草在传统胡杜魔法中用于确保旅行期间的安全和舒适。胡杜从业者和信众经常将这些植物的叶子放入他们的旅行包或行李中，以保护他们的财物并确保旅途平安。聚合草", "link": "pages/herbs.html"}, {"cat": "草药", "name": "棉花 · Cotton", "desc": "棉花：常见的棉花植物在胡杜民间魔法中用于驱散负面能量、吸引好运，并辅助灵性净化与疗愈。棉花原产于小亚细亚，但现在在美国、埃及、印度和地中海地区都有种植。棉花植物", "link": "pages/herbs.html"}, {"cat": "草药", "name": "柯巴脂 · Copal", "desc": "柯巴脂：这里的柯巴脂指的是从普罗蒂乌姆树（Protium tree）中获取的芳香树脂。柯巴脂在传统胡杜民间魔法中用于为家庭吸引平和与宁静，加强人际关系和友谊，并", "link": "pages/herbs.html"}, {"cat": "草药", "name": "珊瑚根 · Coral Root", "desc": "珊瑚兰根：珊瑚兰在胡杜传统实践中用于获得心智清晰与平衡、恢复青春活力，并保护个人免受负面灵性力量的侵害。珊瑚兰原产于北美，在那里它们作为寄生植物生长在特定的真菌", "link": "pages/herbs.html"}, {"cat": "草药", "name": "金鸡菊 · Coreopsis", "desc": "金鸡菊：金鸡菊在草药民间魔法中用于增强个人的自然灵性能量、驱除恐惧，并通过增强的通灵清晰度获得启迪人心的占卜结果。金鸡菊，又名“蜱籽”（tickseed），原产", "link": "pages/herbs.html"}, {"cat": "草药", "name": "芫荽(香菜) · Coriander", "desc": "芫荽：芫荽在胡杜传统魔法中用于吸引爱情和激情，让家庭充满平和与和谐，并驱散纷争和负面能量。芫荽是一种一年生植物，可长到三英尺高，原产于秘鲁和埃及。然而，这种植物", "link": "pages/herbs.html"}, {"cat": "草药", "name": "矢车菊 · Cornflower", "desc": "矢车菊：矢车菊，又名“单身汉纽扣”（bachelor's button），在胡杜传统民间魔法中用于吸引爱情与平和，并增强天生的通灵能力。矢车菊原产于南欧，但现在", "link": "pages/herbs.html"}, {"cat": "草药", "name": "匍匐冰草 · Couch Grass", "desc": "茅草：胡杜从业者利用茅草来保护家庭免受负面灵性能量和不速之客的侵扰。茅草还含有自然的灵性能量，有助于提升通灵清晰度和视觉，并吸引财富和成功。茅草是一种侵略性强的", "link": "pages/herbs.html"}, {"cat": "草药", "name": "子安贝 · Cowrie Shells", "desc": "宝贝贝壳：宝贝贝壳是西非巫毒教实践的遗存，历经岁月仍保留在胡杜实践中。宝贝贝壳在印度洋最为丰富，但在美国和欧洲的水域中也有大量生长。宝贝贝壳在魔法咒语中用于吸引", "link": "pages/herbs.html"}, {"cat": "草药", "name": "林中恶汉 · Cruel Man of the Woods", "desc": "林间残酷草：林间残酷草，顾名思义，是一种强效的地生草药，在胡杜民间魔法中用于加深灵性意识、施展保护咒以抵御负面能量，以及对敌人和对手施咒或下蛊。林间残酷草原产于", "link": "pages/herbs.html"}, {"cat": "草药", "name": "荜澄茄 · Cubeb Pepper", "desc": "荜澄茄：荜澄茄是一种原产于印度尼西亚的木质藤本植物，可长到十二英尺高。荜澄茄在民间魔法中对于招引好运和丰盛、保护自身和家庭免受负面灵性能量的侵害，以及增强生育能", "link": "pages/herbs.html"}, {"cat": "草药", "name": "孜然 · Cumin", "desc": "孜然：孜然在传统胡杜魔法实践中用于驱除家中的负面灵性能量和振动。孜然常被用于草药束中来防止盗窃，以及施展为居所招来内心平静的咒语。孜然可长到两英尺高，原产于波斯", "link": "pages/herbs.html"}, {"cat": "草药", "name": "达米阿那 · Damiana", "desc": "达米阿那：胡杜民间魔法师燃烧达米阿那作为熏香，以增强他们的通灵能力、获得更清晰和更具启迪性的占卜结果，并为家庭招引平和与宁静。达米阿那也用于保护和招引好运的咒语", "link": "pages/herbs.html"}, {"cat": "草药", "name": "蒲公英 · Dandelion", "desc": "蒲公英：蒲公英在胡杜民间魔法中用于吸引爱情、实现愿望、召唤正面的灵魂，以及平息猛烈的风暴。蒲公英是一种多年生草本植物，具有粗壮的主根，生长在北美、欧洲和北半球的", "link": "pages/herbs.html"}, {"cat": "草药", "name": "鹿舌草 · Deer’s Tongue", "desc": "鹿舌草：鹿舌草主要用于胡毒民间魔法，为人们的生活招来爱情与激情。不过，这种独特的药草也被用于增强通灵连接、招来成功与财富。鹿舌草原产于北美松林，但南欧也有生长。", "link": "pages/herbs.html"}, {"cat": "草药", "name": "魔鬼荚 · Devil’s Pod", "desc": "魔鬼豆荚（Devil’s Pod）：魔鬼豆荚是一年生草本植物，分布于欧洲、亚洲和非洲，主要生长在水生环境中。其根部可延伸至水体中长达五米。该植物最著名的是其形状", "link": "pages/herbs.html"}, {"cat": "草药", "name": "鬼臼 · Devil’s Bit", "desc": "魔鬼草（Devil’s Bit）：魔鬼草是一种开紫色花的开花植物，主要生长在沼泽、泥炭地等潮湿环境中。魔鬼草原产于不列颠群岛以及西欧和中欧其他地区，在北美和中亚", "link": "pages/herbs.html"}, {"cat": "草药", "name": "魔鬼鞋带根 · Devil’s Shoestring", "desc": "魔鬼鞋带草（Devil’s Shoestring）：魔鬼鞋带草是多年生莲座状草本植物，主要在4月至6月间开花。它原产于北美，在欧洲和亚洲部分地区也能生长。胡毒从", "link": "pages/herbs.html"}, {"cat": "草药", "name": "莳萝 · Dill", "desc": "莳萝：莳萝在胡毒民间魔法中用于招来丰盛、保护家园免受邪恶精神力量侵害、驱除嫉妒、猜忌和流言蜚语，并增强激情与性吸引力。莳萝是耐寒的一年生草本植物，原产于俄罗斯南", "link": "pages/herbs.html"}, {"cat": "草药", "name": "泥蜂巢 · Dirt Dauber Nest", "desc": "泥蜂巢：泥蜂（泥蜂科）的巢由泥土和其他天然颗粒筑成，通常呈椭圆形，形似雪茄。巢通常见于裂缝和缝隙中，泥蜂原产于北美。在胡毒民间医学中，泥蜂巢中的泥土可用于治疗疖", "link": "pages/herbs.html"}, {"cat": "草药", "name": "克里特白鲜 · Dittany of Crete", "desc": "克里特白鲜（Dittany of Crete）：白鲜在胡毒民间魔法实践中用于吸引爱情与激情、与灵魂沟通，并增强梦想与愿望的实现。白鲜原产于克里特岛，如今在北美和", "link": "pages/herbs.html"}, {"cat": "草药", "name": "夹竹桃麻 · Dogbane", "desc": "毒狗草（Dogbane）：毒狗草是一种致命的有毒植物，因其对狗有致命作用而得名。在胡毒民间魔法中，毒狗草用于增强与灵界的精神连接、对敌人施咒和下蛊，并保护个人免", "link": "pages/herbs.html"}, {"cat": "草药", "name": "龙血树脂 · Dr 胡毒医学中，海葱用于治", "link": "pages/herbs.html"}, {"cat": "草药", "name": "八角(大茴香) · Star Anise", "desc": "八角茴香（星茴香）：八角茴香以其特有的星形叶子而得名。这种常绿药草原产于中国和越南，并在欧洲和北美的部分地区生长。八角茴香结出坚硬的褐色种子荚，可以加工成浓烈的", "link": "pages/herbs.html"}, {"cat": "草药", "name": "硫磺 · Sulfur", "desc": "硫磺：元素硫是一种柔软的黄色固体。这种元素在胡毒民间魔法中用于净化空间，清除所有负面振动和邪恶力量。硫磺也可以用于保护法术和护身符中，以抵御负面能量并确保旅行期", "link": "pages/herbs.html"}, {"cat": "草药", "name": "盐肤木浆果 · Sumac Berries", "desc": "漆树浆果（Sumac Berries）：漆树是一种高达十五英尺的宏伟草药，有美丽的红绿色叶子和浅灰色树皮。漆树浆果主要作为原生植物分布于北美。它们在美国、加拿大", "link": "pages/herbs.html"}, {"cat": "草药", "name": "枫香脂 · Sweet Gum", "desc": "枫香树（Sweet Gum）：枫香树也被称为美洲苏合香，这种巨大的宏伟树木原产于北美、中美洲和墨西哥。该树也生长在欧洲和亚洲的温带地区。枫香树的果实用于胡毒民间", "link": "pages/herbs.html"}, {"cat": "草药", "name": "艾菊 · Tansy", "desc": "艾菊（Tansy）：艾菊是一种坚韧的多年生草本植物，有直立光滑的茎和亮黄色的花。这种药草原产于亚洲和欧洲，但在美国和加拿大的大部分地区都有生长。艾菊在胡毒民间魔", "link": "pages/herbs.html"}, {"cat": "草药", "name": "茶叶 · Tea", "desc": "茶（Tea）：茶是一种具有重要商业意义的植物，几个世纪以来一直被认为是一种有价值的商品。茶起源于东亚，但现在在美洲、欧洲和热带非洲的大部分地区都有种植。茶叶可以", "link": "pages/herbs.html"}, {"cat": "草药", "name": "金鸡纳树皮 · Tenbark", "desc": "金鸡纳树皮（Tenbark）：金鸡纳树皮原产于南美洲，但目前见于非洲、印度和中美洲。用金鸡纳树树皮制成的煎剂可用于退烧。树皮含有高水平的奎宁，有助于治愈疟疾。该", "link": "pages/herbs.html"}, {"cat": "草药", "name": "百里香 · Thyme", "desc": "百里香（Thyme）：百里香在胡毒中用于促进放松睡眠、清除家中的负面精神能量，并吸引爱情和激情进入家中。百里香在北美、欧洲和亚洲部分地区生长良好。百里香可长到六", "link": "pages/herbs.html"}, {"cat": "草药", "name": "烟草 · Tobacco", "desc": "烟草（Tobacco）：烟草用于净化环境、消除负面能量并提高通灵能力。烟草原产于北美，目前在中国、土耳其和热带非洲种植。烟草是一种一年生植物，具有特征性的皱褶椭", "link": "pages/herbs.html"}, {"cat": "草药", "name": "独角根 · Unicorn Root", "desc": "独角根（Unicorn Root）：独角根是百合科多年生植物，原产于北美。独角根目前在美国、加拿大和墨西哥的部分地区生长。这种草药可以撒在家里以驱除邪恶能量，增", "link": "pages/herbs.html"}, {"cat": "草药", "name": "甘草(万德尔根) · Vandal Root", "desc": "缬草根（Vandal Root）：缬草根也称为缬草根，在胡毒民间魔法中用于吸引爱情、确保清爽放松的睡眠，并在家周围建立强大的屏障以抵御各种负面能量。缬草根有带沟", "link": "pages/herbs.html"}, {"cat": "草药", "name": "香草 · Vanilla", "desc": "香草（Vanilla）：香草草药主要用于传统胡毒民间医学中，以吸引爱情和激情。这种草药也有助于清醒头脑和提高修行者的通灵能力。香草实际上是墨西哥原产的一种兰花产", "link": "pages/herbs.html"}, {"cat": "草药", "nam   var html=res.slice(0,80).map(function(it){
    return '<a class="search-item" href="'+it.link+'" style="display:block;padding:12px 0;border-bottom:1px solid #f0f0f0;text-decoration:none;color:#1a1a1a;">'+
      '<span style="font-size:11px;color:#999;font-family:Inter,sans-serif;text-transform:uppercase;letter-spacing:.5px;">'+esc(it.cat)+'</span><br>'+
      '<span style="font-weight:600;">'+esc(it.name)+'</span><br>'+
      '<span style="font-size:13px;color:#777;">'+esc(it.desc)+'</span></a>';
  }).join('');
  box.innerHTML=html;
}
document.addEventListener('click',function(e){
  var m=document.getElementById('navMenu');var t=document.getElementById('navToggle');
  if(m&&t&&m.classList.contains('open')&&!m.contains(e.target)&&!t.contains(e.target)){m.classList.remove('open');t.classList.remove('active');var o=document.getElementById('navOverlay');if(o)o.classList.remove('show');}
});
</script>
