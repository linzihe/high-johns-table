<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 蜡烛 -->
  <symbol id="icon-candle" viewBox="0 0 24 24">
    <rect x="10" y="6" width="4" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 6c0-2 1-3 1-4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M12 6c0-2-1-3-1-4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="12" cy="18.5" rx="3" ry="1" fill="none" stroke="currentColor" stroke-width="1.2"/>
  </symbol>
  <!-- 灯/火焰 -->
  <symbol id="icon-flame" viewBox="0 0 24 24">
    <path d="M12 2C10 7 6 10 6 14a6 6 0 0 0 12 0c0-4-4-7-6-12z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="12" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
  </symbol>
  <!-- 盐 -->
  <symbol id="icon-salt" viewBox="0 0 24 24">
    <path d="M8 3h8l2 18H6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="12" cy="9" r="1" fill="currentColor"/>
    <circle cx="10" cy="13" r="0.8" fill="currentColor"/>
    <circle cx="14" cy="13" r="0.8" fill="currentColor"/>
    <circle cx="12" cy="16" r="1" fill="currentColor"/>
  </symbol>
  <!-- 碗/碟 -->
  <symbol id="icon-bowl" viewBox="0 0 24 24">
    <path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M4 12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 14l-2 7h12l-2-7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
  <!-- 纸张 -->
  <symbol id="icon-paper" viewBox="0 0 24 24">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="8" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="8" y1="17" x2="13" y2="17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>
  <!-- 杯/水 -->
  <symbol id="icon-cup" viewBox="0 0 24 24">
    <path d="M7 3h10l-1.5 15H8.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M7 3l-1 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M17 3l1 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="14" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <!-- 石头/水晶 -->
  <symbol id="icon-stone" viewBox="0 0 24 24">
    <path d="M12 3l8 6-4 11H8L4 9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="12" y1="3" x2="12" y2="20" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="9" x2="20" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
</svg>
